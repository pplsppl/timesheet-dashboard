<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Care Coordinators — Timesheets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #F4F3EF;
      --surface:   #FFFFFF;
      --border:    rgba(0,0,0,0.07);
      --border-md: rgba(0,0,0,0.13);
      --text:      #17161A;
      --muted:     #68676D;
      --hint:      #A09FA6;
      --accent:    #185FA5;
      --accent-lt: #E6F1FB;
      --accent-tx: #0C447C;
      --red:       #DC2626;
      --red-lt:    #FEE2E2;
      --red-tx:    #7F1D1D;
      --green:     #16A34A;
      --green-lt:  #DCFCE7;
      --green-tx:  #14532D;
      --amber-lt:  #FEF3C7;
      --amber-tx:  #78350F;
      --purple-lt: #EDE9FE;
      --purple-tx: #4C1D95;
      --teal-lt:   #CCFBF1;
      --teal-tx:   #134E4A;
      --pink-lt:   #FCE7F3;
      --pink-tx:   #831843;
      --warn-lt:   #FEF9C3;
      --warn-tx:   #713F12;
      --punch-bg:  #F9F8F5;
      --flag-bg:   #FFF7ED;
      --flag-bdr:  #FED7AA;
      --flag-tx:   #9A3412;
      --r:         8px;
      --r-lg:      12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:        #111013;
        --surface:   #1A191D;
        --border:    rgba(255,255,255,0.07);
        --border-md: rgba(255,255,255,0.13);
        --text:      #EEEDF2;
        --muted:     #9B9AA1;
        --hint:      #5C5B63;
        --accent:    #378ADD;
        --accent-lt: #0C2A4A;
        --accent-tx: #85B7EB;
        --red:       #F87171;
        --red-lt:    #450A0A;
        --red-tx:    #FCA5A5;
        --green:     #4ADE80;
        --green-lt:  #052E16;
        --green-tx:  #86EFAC;
        --amber-lt:  #3B1F03;
        --amber-tx:  #FCD34D;
        --purple-lt: #2E1065;
        --purple-tx: #C4B5FD;
        --teal-lt:   #042F2E;
        --teal-tx:   #99F6E4;
        --pink-lt:   #500724;
        --pink-tx:   #F9A8D4;
        --warn-lt:   #3B1F03;
        --warn-tx:   #FCD34D;
        --punch-bg:  #141316;
        --flag-bg:   #2C1A08;
        --flag-bdr:  #92400E;
        --flag-tx:   #FCD34D;
      }
    }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

    /* ── Login ── */
    #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .login-card { background: var(--surface); border: 0.5px solid var(--border-md); border-radius: var(--r-lg); padding: 40px 36px; width: 100%; max-width: 380px; }
    .login-logo { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .login-logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; }
    .login-logo-text { font-size: 15px; font-weight: 600; }
    .login-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; display: block; }
    .login-input { width: 100%; padding: 10px 12px; border: 0.5px solid var(--border-md); border-radius: var(--r); background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px; outline: none; margin-bottom: 12px; }
    .login-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(24,95,165,0.12); }
    .login-btn { width: 100%; padding: 10px; background: var(--accent); color: #fff; border: none; border-radius: var(--r); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
    .login-btn:hover { opacity: 0.88; }
    .login-btn:disabled { opacity: 0.5; cursor: default; }
    .login-error { font-size: 13px; color: var(--red-tx); background: var(--red-lt); padding: 8px 12px; border-radius: var(--r); margin-top: 10px; display: none; }

    /* ── Dashboard ── */
    #dashboard { display: none; }

    .topbar { background: var(--surface); border-bottom: 0.5px solid var(--border); padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; position: sticky; top: 0; z-index: 20; }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .dept-chip { background: var(--accent-lt); color: var(--accent-tx); font-size: 11.5px; font-weight: 500; padding: 3px 9px; border-radius: var(--r); }
    .topbar-title { font-size: 14px; font-weight: 500; }
    .topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; animation: pulse 2.5s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .status-txt { font-size: 12px; color: var(--muted); }
    .week-nav { display: flex; align-items: center; gap: 4px; }
    .week-nav .wlabel { font-size: 12.5px; color: var(--muted); min-width: 148px; text-align: center; font-weight: 500; }
    .icon-btn { width: 30px; height: 30px; border: 0.5px solid var(--border-md); border-radius: var(--r); background: none; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; cursor: pointer; }
    .icon-btn:hover { background: var(--bg); }
    .icon-btn:disabled { opacity: 0.35; cursor: default; }
    .text-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border: 0.5px solid var(--border-md); border-radius: var(--r); background: none; color: var(--muted); font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer; white-space: nowrap; }
    .text-btn:hover { background: var(--bg); color: var(--text); }
    .text-btn i { font-size: 14px; }

    /* ── Metrics ── */
    .metrics-wrap { padding: 16px 24px; border-bottom: 0.5px solid var(--border); background: var(--surface); }
    .metrics-section-label { font-size: 10.5px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 8px; }
    .metrics-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .metrics-row:last-child { margin-bottom: 0; }
    .metric { background: var(--bg); border-radius: var(--r); padding: 11px 13px; min-width: 100px; flex: 1; }
    .metric-label { font-size: 11px; color: var(--muted); font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .metric-val { font-size: 20px; font-weight: 500; line-height: 1; }
    .metric-val.blue   { color: var(--accent); }
    .metric-val.green  { color: var(--green); }
    .metric-val.amber  { color: #B45309; }
    .metric-val.red    { color: var(--red); }
    .metric-divider { width: 100%; height: 0.5px; background: var(--border); margin: 10px 0; }

    /* ── Flag banner ── */
    .flag-banner { margin: 16px 24px 0; background: var(--flag-bg); border: 1px solid var(--flag-bdr); border-radius: var(--r-lg); overflow: hidden; }
    .flag-header { display: flex; align-items: center; gap: 8px; padding: 11px 16px; cursor: pointer; user-select: none; }
    .flag-header i.ti-alert-triangle { font-size: 17px; color: var(--flag-tx); }
    .flag-title { font-size: 13px; font-weight: 600; color: var(--flag-tx); flex: 1; }
    .flag-chevron { font-size: 14px; color: var(--flag-tx); transition: transform 0.18s; }
    .flag-chevron.open { transform: rotate(90deg); }
    .flag-body { border-top: 1px solid var(--flag-bdr); }
    .flag-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 16px; border-bottom: 0.5px solid var(--flag-bdr); font-size: 13px; }
    .flag-row:last-child { border-bottom: none; }
    .flag-row i { font-size: 15px; color: var(--flag-tx); flex-shrink: 0; margin-top: 1px; }
    .flag-name { font-weight: 500; }
    .flag-detail { color: var(--muted); font-size: 12px; margin-top: 1px; }

    /* ── Content ── */
    .content { padding: 16px 24px 60px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .search-wrap { position: relative; }
    .search-wrap i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 15px; color: var(--hint); pointer-events: none; }
    .search-input { width: 200px; padding: 7px 10px 7px 32px; border: 0.5px solid var(--border-md); border-radius: var(--r); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
    .search-input:focus { border-color: var(--accent); }
    .filter-select { padding: 7px 10px; border: 0.5px solid var(--border-md); border-radius: var(--r); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13px; outline: none; }
    .emp-count { font-size: 12px; color: var(--hint); margin-left: auto; }

    /* ── Table ── */
    .table-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    thead th { text-align: left; padding: 9px 12px; font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--bg); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
    th.r, td.r { text-align: right; }

    tr.emp-row { cursor: pointer; }
    tr.emp-row td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); vertical-align: middle; }
    tr.emp-row:hover td { background: var(--bg); }
    tr.emp-row.open td { background: var(--bg); border-bottom: none; }
    tr.emp-row.flagged td { background: #FFFBEB; }
    tr.emp-row.flagged:hover td { background: #FEF3C7; }
    tr.emp-row.flagged.open td { background: #FEF3C7; border-bottom: none; }

    .emp-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .emp-title { font-size: 11.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }

    /* ── 40hr bar: blue (worked) + green (leave) ── */
    .bar-outer { height: 4px; background: var(--border-md); border-radius: 2px; margin-top: 5px; overflow: hidden; position: relative; }
    .bar-blue  { height: 100%; background: var(--accent); position: absolute; left: 0; top: 0; border-radius: 2px 0 0 2px; }
    .bar-green { height: 100%; background: var(--green); position: absolute; top: 0; }
    .bar-red   { height: 100%; background: var(--red); position: absolute; top: 0; border-radius: 0 2px 2px 0; }

    .chevron { color: var(--hint); font-size: 14px; display: inline-block; transition: transform 0.18s; }
    .chevron.open { transform: rotate(90deg); }
    .num { font-family: 'DM Mono', monospace; font-size: 12px; }
    .dim { color: var(--hint); }
    .over-badge { display: inline-flex; align-items: center; gap: 3px; background: var(--red-lt); color: var(--red-tx); font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 20px; margin-left: 5px; font-family: 'DM Mono', monospace; }

    /* ── Badges ── */
    .badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .b-reg    { background: var(--accent-lt);  color: var(--accent-tx); }
    .b-ot     { background: var(--amber-lt);   color: var(--amber-tx); }
    .b-pto    { background: var(--green-lt);   color: var(--green-tx); }
    .b-sick   { background: var(--teal-lt);    color: var(--teal-tx); }
    .b-brvmt  { background: var(--purple-lt);  color: var(--purple-tx); }
    .b-makeup { background: var(--pink-lt);    color: var(--pink-tx); }
    .b-unpaid { background: var(--bg);         color: var(--muted); border: 0.5px solid var(--border-md); }
    .b-leave  { background: var(--green-lt);   color: var(--green-tx); }

    /* ── Punch section ── */
    tr.punch-section td { padding: 0; border-bottom: 0.5px solid var(--border); }
    .punch-inner { background: var(--punch-bg); }
    .punch-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .punch-table thead th { padding: 6px 12px; font-size: 11px; font-weight: 500; color: var(--hint); background: var(--punch-bg); border-bottom: 0.5px solid var(--border); text-align: left; }
    .punch-table thead th.r { text-align: right; }
    .punch-table tbody td { padding: 8px 12px; font-size: 12.5px; border-bottom: 0.5px solid var(--border); background: var(--punch-bg); vertical-align: top; }
    .punch-table tbody tr:last-child td { border-bottom: none; }
    .punch-table tbody tr.punch-flagged td { background: #FFFBEB; }
    .punch-table tbody tr.punch-leave td { background: #F0FDF4; }
    .punch-time { font-family: 'DM Mono', monospace; font-size: 12px; }
    .comment-tag { display: inline-flex; align-items: flex-start; gap: 5px; background: var(--warn-lt); color: var(--warn-tx); font-size: 11.5px; padding: 4px 8px; border-radius: var(--r); margin-top: 4px; line-height: 1.4; }
    .comment-tag i { font-size: 13px; flex-shrink: 0; margin-top: 1px; }

    /* ── States ── */
    .state-view { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--muted); gap: 10px; font-size: 13.5px; }
    .state-view i { font-size: 32px; opacity: 0.3; }
    .state-view.err { color: var(--red-tx); }
    .state-view.err i { opacity: 0.6; }
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border-md); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Legend ── */
    .bar-legend { display: flex; align-items: center; gap: 12px; margin-top: 8px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
    .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon"><i class="ti ti-clock-hour-4"></i></div>
      <div class="login-logo-text">Care Coordinators — Timesheets</div>
    </div>
    <label class="login-label" for="pwInput">Password</label>
    <input class="login-input" type="password" id="pwInput" placeholder="Enter password" autocomplete="current-password" />
    <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign in</button>
    <div class="login-error" id="loginError">Incorrect password. Try again.</div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <span class="dept-chip">Care Coordinators</span>
      <span class="topbar-title">Weekly timesheets</span>
    </div>
    <div class="topbar-right">
      <span class="live-dot"></span>
      <span class="status-txt" id="statusLine">Loading…</span>
      <div class="week-nav">
        <button class="icon-btn" id="prevBtn" onclick="shiftWeek(-1)"><i class="ti ti-chevron-left"></i></button>
        <span class="wlabel" id="weekLabel">—</span>
        <button class="icon-btn" id="nextBtn" onclick="shiftWeek(1)"><i class="ti ti-chevron-right"></i></button>
      </div>
      <button class="text-btn" id="todayBtn" onclick="goCurrentWeek()" style="display:none"><i class="ti ti-home"></i> Current week</button>
      <button class="text-btn" onclick="refreshData()"><i class="ti ti-refresh"></i> Refresh</button>
      <button class="text-btn" onclick="exportCSV()"><i class="ti ti-download"></i> Export CSV</button>
    </div>
  </div>

  <div class="metrics-wrap">
    <div class="metrics-section-label">Worked hours</div>
    <div class="metrics-row" id="workedMetrics"></div>
    <div class="metric-divider"></div>
    <div class="metrics-section-label">Leave</div>
    <div class="metrics-row" id="leaveMetrics"></div>
    <div class="metric-divider"></div>
    <div class="bar-legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Worked hours (40hr target)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Leave (not counted toward OT)</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--red)"></div>Overtime (over 40h worked)</div>
    </div>
  </div>

  <div id="flagBanner" style="display:none">
    <div class="flag-banner">
      <div class="flag-header" onclick="toggleFlagBanner()">
        <i class="ti ti-alert-triangle"></i>
        <span class="flag-title" id="flagTitle">Entries requiring review</span>
        <i class="ti ti-chevron-right flag-chevron open" id="flagChevron"></i>
      </div>
      <div class="flag-body" id="flagBody"></div>
    </div>
  </div>

  <div class="content">
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" type="text" id="searchInput" placeholder="Search employee…" oninput="renderTable()" />
      </div>
      <select class="filter-select" id="managerFilter" onchange="renderTable()">
        <option value="">All managers</option>
      </select>
      <span class="emp-count" id="empCount"></span>
    </div>
    <div class="table-card" id="tableWrap">
      <div class="state-view"><div class="spinner"></div><span>Loading…</span></div>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════
   Leave type → badge class + display name
═══════════════════════════════════ */
const LEAVE_BADGE = {
  'Paid Time Off - Ops':        { cls: 'b-pto',    label: 'PTO' },
  'Part-Time Time Off - Ops':   { cls: 'b-unpaid', label: 'Part-Time Off' },
  'Statutory Paid Sick Leave':  { cls: 'b-sick',   label: 'Sick Leave' },
  'Bereavement':                { cls: 'b-brvmt',  label: 'Bereavement' },
  'Make-Up Time Request':       { cls: 'b-makeup', label: 'Make-Up Time' },
  'Make-Up Time':               { cls: 'b-makeup', label: 'Make-Up Time' },
  'Vacation':                   { cls: 'b-pto',    label: 'PTO' },
  'Sick Leave':                 { cls: 'b-sick',   label: 'Sick Leave' },
};

function leaveBadge(typeName) {
  return LEAVE_BADGE[typeName] || { cls: 'b-leave', label: typeName || 'Leave' };
}

/* ═══════════════════════════════════
   State
═══════════════════════════════════ */
let workers     = {};
let managers    = {};
let timeEntries = [];
let timeOff     = [];
let weekOffset  = 0;
let expandedId  = null;
let flagOpen    = true;

/* ═══════════════════════════════════
   Boot
═══════════════════════════════════ */
(async function boot() {
  try {
    const r = await fetch('/api/auth');
    if (r.ok) showDashboard(); else showLogin();
  } catch { showLogin(); }
})();

function showLogin() {
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  setTimeout(() => document.getElementById('pwInput').focus(), 50);
}
function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  updateWeekLabel();
  loadAll();
}

/* ═══════════════════════════════════
   Login
═══════════════════════════════════ */
document.getElementById('pwInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const pw  = document.getElementById('pwInput').value;
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Signing in…'; err.style.display = 'none';
  try {
    const r = await fetch('/api/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    if (r.ok) { showDashboard(); }
    else { err.style.display = 'block'; document.getElementById('pwInput').value = ''; document.getElementById('pwInput').focus(); }
  } catch { err.textContent = 'Network error — please try again.'; err.style.display = 'block'; }
  finally { btn.disabled = false; btn.textContent = 'Sign in'; }
}

/* ═══════════════════════════════════
   Data
═══════════════════════════════════ */
async function loadAll() {
  setLoading();
  try {
    const [wRes, tRes, toRes] = await Promise.all([
      apiFetch('/api/timesheets?endpoint=workers'),
      fetchTimeEntries(),
      fetchTimeOff(),
    ]);

    workers = {};
    managers = wRes.managers || {};
    (wRes.results || []).forEach(w => {
      const u = w.user || {};
      const name = [u.first_name || '', u.last_name || ''].filter(Boolean).join(' ') || w.work_email || w.id;
      workers[w.id] = { name, title: w.title || '—', managerId: w.manager_id || null };
    });

    timeEntries = tRes.results || [];
    timeOff     = toRes.results || [];

    populateManagerFilter();
    renderAll();
    document.getElementById('statusLine').textContent =
      'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    if (e.message === '401') { showLogin(); return; }
    showError(e.message);
  }
}

async function fetchTimeEntries() {
  const { start, end } = weekBounds();
  return apiFetch(`/api/timesheets?startDate=${toDateStr(start)}&endDate=${toDateStr(end)}`);
}
async function fetchTimeOff() {
  const { start, end } = weekBounds();
  return apiFetch(`/api/timesheets?endpoint=timeoff&startDate=${toDateStr(start)}&endDate=${toDateStr(end)}`);
}
async function apiFetch(url) {
  const r = await fetch(url);
  if (!r.ok) {
    const j = await r.json().catch(() => ({}));
    const e = new Error(j.error || `HTTP ${r.status}`);
    if (r.status === 401) e.message = '401';
    throw e;
  }
  return r.json();
}

async function refreshData() {
  document.getElementById('statusLine').textContent = 'Refreshing…';
  try {
    const [tRes, toRes] = await Promise.all([fetchTimeEntries(), fetchTimeOff()]);
    timeEntries = tRes.results || [];
    timeOff     = toRes.results || [];
    renderAll();
    document.getElementById('statusLine').textContent =
      'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    if (e.message === '401') { showLogin(); return; }
    document.getElementById('statusLine').textContent = 'Refresh failed';
  }
}

/* ═══════════════════════════════════
   Week (Sun–Sat)
═══════════════════════════════════ */
function weekBounds(offset = weekOffset) {
  const now = new Date();
  const sun = new Date(now);
  sun.setDate(now.getDate() - now.getDay() + offset * 7);
  sun.setHours(0,0,0,0);
  const sat = new Date(sun);
  sat.setDate(sun.getDate() + 6);
  sat.setHours(23,59,59,999);
  return { start: sun, end: sat };
}
function toDateStr(d) { return d.toISOString().split('T')[0]; }
function fmtDate(d)   { return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }); }
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : null; }
function hrsFromSeg(s) { return s.start_time && s.end_time ? (new Date(s.end_time) - new Date(s.start_time)) / 3_600_000 : 0; }

function updateWeekLabel() {
  const { start, end } = weekBounds();
  document.getElementById('weekLabel').textContent = `${fmtDate(start)} – ${fmtDate(end)}`;
  document.getElementById('nextBtn').disabled = weekOffset >= 0;
  document.getElementById('todayBtn').style.display = weekOffset !== 0 ? 'inline-flex' : 'none';
}
function shiftWeek(d) { weekOffset += d; updateWeekLabel(); loadAll(); }
function goCurrentWeek() { weekOffset = 0; updateWeekLabel(); loadAll(); }

/* ═══════════════════════════════════
   Manager filter
═══════════════════════════════════ */
function populateManagerFilter() {
  const sel = document.getElementById('managerFilter');
  const cur = sel.value;
  const opts = Object.entries(managers)
    .sort((a, b) => a[1].name.localeCompare(b[1].name))
    .map(([id, m]) => `<option value="${id}"${id === cur ? ' selected' : ''}>${esc(m.name)}</option>`)
    .join('');
  sel.innerHTML = '<option value="">All managers</option>' + opts;
}

/* ═══════════════════════════════════
   Segment category (for worked time)
═══════════════════════════════════ */
function segCat(name) {
  const n = (name || '').toLowerCase();
  if (n.includes('regular'))                               return 'regular';
  if (n.includes('overtime') || n.includes('over time'))   return 'ot';
  if (n.includes('double'))                                return 'ot';
  return 'regular';
}

function emptyBucket() {
  return {
    // worked
    regular: 0, ot: 0,
    workedTotal: 0,
    // leave (never counts toward OT)
    pto: 0, sick: 0, bereavement: 0, makeup: 0, parttime: 0, otherLeave: 0,
    leaveTotal: 0,
    entries: [],
    flags: [],
  };
}

/* ═══════════════════════════════════
   Process entries
═══════════════════════════════════ */
function processAll() {
  const totals = emptyBucket();
  const byEmp  = {};
  Object.keys(workers).forEach(id => { byEmp[id] = emptyBucket(); });

  // ── Time entries (worked hours) ──
  timeEntries.forEach(entry => {
    const wid  = entry.worker_id || entry.worker || 'unknown';
    if (!byEmp[wid]) byEmp[wid] = emptyBucket();

    const segs   = (entry.segments || []).filter(s => !s.break_type_id);
    const breaks = (entry.segments || []).filter(s =>  s.break_type_id);
    const breakHrs = breaks.reduce((a, s) => a + hrsFromSeg(s), 0);
    const entryHrs = segs.reduce((a, s) => a + hrsFromSeg(s), 0);

    if (segs.length) {
      segs.forEach(seg => {
        const hrs = hrsFromSeg(seg);
        if (hrs <= 0) return;
        const cat = segCat(seg.display_name);
        byEmp[wid][cat]         += hrs;
        byEmp[wid].workedTotal  += hrs;
        totals[cat]             += hrs;
        totals.workedTotal      += hrs;
      });
    } else {
      const s   = entry.time_entry_summary || {};
      const reg = s.regular_hours || 0;
      const ot  = (s.over_time_hours || 0) + (s.double_over_time_hours || 0);
      [['regular', reg], ['ot', ot]].forEach(([cat, hrs]) => {
        if (!hrs) return;
        byEmp[wid][cat]        += hrs;
        byEmp[wid].workedTotal += hrs;
        totals[cat]            += hrs;
        totals.workedTotal     += hrs;
      });
    }

    const flagged = entryHrs > 10.5;
    if (flagged) byEmp[wid].flags.push({ date: entry.start_time, hrs: entryHrs });

    byEmp[wid].entries.push({
      id:        entry.id,
      date:      entry.start_time ? new Date(entry.start_time) : null,
      clockIn:   entry.start_time,
      clockOut:  entry.end_time,
      breakHrs,
      hrs:       entryHrs,
      flagged,
      segments:  segs,
      comments:  (entry.comments || []).map(c => c.text).filter(Boolean),
      isLeave:   false,
    });
  });

  // ── Leave requests ──
  timeOff.forEach(to => {
    const wid = to.worker_id || 'unknown';
    if (!byEmp[wid]) byEmp[wid] = emptyBucket();
    const hrs = to.hours || 0;
    if (hrs <= 0) return;

    const typeName = to.leave_type || 'Leave';

    // Map to bucket key
    let leaveKey = 'otherLeave';
    if (typeName.includes('Paid Time Off'))              leaveKey = 'pto';
    else if (typeName.includes('Sick'))                  leaveKey = 'sick';
    else if (typeName.includes('Bereavement'))           leaveKey = 'bereavement';
    else if (typeName.includes('Make-Up'))               leaveKey = 'makeup';
    else if (typeName.includes('Part-Time'))             leaveKey = 'parttime';
    else if (typeName.includes('Vacation'))              leaveKey = 'pto';

    byEmp[wid][leaveKey]    += hrs;
    byEmp[wid].leaveTotal   += hrs;
    totals[leaveKey]        += hrs;
    totals.leaveTotal       += hrs;

    // Partial day: format start time if provided
    const startTimeStr = to.start_time ? fmtTime(to.start_time) : null;

    byEmp[wid].entries.push({
      id:          to.date + '-' + wid + '-' + leaveKey,
      date:        to.date ? new Date(to.date + 'T12:00:00') : null,
      clockIn:     null,
      clockOut:    null,
      breakHrs:    0,
      hrs,
      flagged:     false,
      segments:    [],
      comments:    to.reason ? [to.reason] : [],
      isLeave:     true,
      leaveType:   typeName,
      isPaid:      to.is_paid,
      startTimeStr,
      isPartial:   hrs < 8,
    });
  });

  // Sort entries by date per employee
  Object.values(byEmp).forEach(b => b.entries.sort((a, b) => (a.date || 0) - (b.date || 0)));

  return { totals, byEmp };
}

/* ═══════════════════════════════════
   Render all
═══════════════════════════════════ */
function renderAll() {
  const { totals, byEmp } = processAll();
  renderMetrics(totals);
  renderFlagBanner(byEmp);
  renderTable(byEmp);
}

/* ── Metrics ── */
function renderMetrics(t) {
  document.getElementById('workedMetrics').innerHTML = `
    <div class="metric"><div class="metric-label">Total worked</div><div class="metric-val blue">${t.workedTotal.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Regular</div><div class="metric-val">${t.regular.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Overtime</div><div class="metric-val ${t.ot > 0 ? 'amber' : ''}">${t.ot.toFixed(1)}</div></div>
  `;
  document.getElementById('leaveMetrics').innerHTML = `
    <div class="metric"><div class="metric-label">PTO</div><div class="metric-val green">${t.pto.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Sick leave</div><div class="metric-val">${t.sick.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Bereavement</div><div class="metric-val">${t.bereavement.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Make-Up Time</div><div class="metric-val">${t.makeup.toFixed(1)}</div></div>
    <div class="metric"><div class="metric-label">Part-Time Off</div><div class="metric-val">${t.parttime.toFixed(1)}</div></div>
  `;
}

/* ── Flag banner ── */
function renderFlagBanner(byEmp) {
  const flags = [];
  Object.entries(byEmp).forEach(([wid, d]) => {
    d.flags.forEach(f => {
      const w = workers[wid] || { name: wid };
      const dateStr = f.date ? new Date(f.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '—';
      flags.push({ name: w.name, date: dateStr, hrs: f.hrs });
    });
  });
  const banner = document.getElementById('flagBanner');
  if (!flags.length) { banner.style.display = 'none'; return; }
  banner.style.display = 'block';
  document.getElementById('flagTitle').textContent = `${flags.length} shift${flags.length === 1 ? '' : 's'} over 10.5 hours — review required`;
  document.getElementById('flagBody').innerHTML = flags.map(f => `
    <div class="flag-row">
      <i class="ti ti-clock-exclamation"></i>
      <div>
        <div class="flag-name">${esc(f.name)}</div>
        <div class="flag-detail">${f.date} · ${f.hrs.toFixed(1)}h logged</div>
      </div>
    </div>`).join('');
}

function toggleFlagBanner() {
  flagOpen = !flagOpen;
  document.getElementById('flagBody').style.display = flagOpen ? 'block' : 'none';
  document.getElementById('flagChevron').className = `ti ti-chevron-right flag-chevron${flagOpen ? ' open' : ''}`;
}

/* ── Employee table ── */
function renderTable(byEmpArg) {
  const search  = (document.getElementById('searchInput')?.value || '').toLowerCase();
  const mgrFilt = document.getElementById('managerFilter')?.value || '';
  const { byEmp } = byEmpArg ? { byEmp: byEmpArg } : processAll();

  let empIds = Object.keys(workers).filter(id => {
    if (search  && !workers[id].name.toLowerCase().includes(search)) return false;
    if (mgrFilt && workers[id].managerId !== mgrFilt) return false;
    return true;
  });

  empIds.sort((a, b) => (byEmp[b]?.workedTotal || 0) - (byEmp[a]?.workedTotal || 0));
  document.getElementById('empCount').textContent = empIds.length + ' employees';

  if (!empIds.length) {
    document.getElementById('tableWrap').innerHTML = stateHTML('ti-users', 'No employees match');
    return;
  }

  const maxWorked = empIds.reduce((m, id) => Math.max(m, byEmp[id]?.workedTotal || 0), 0) || 40;

  const rows = empIds.map(id => {
    const w      = workers[id];
    const d      = byEmp[id] || emptyBucket();
    const worked = d.workedTotal;
    const leave  = d.leaveTotal;
    const isOpen = expandedId === id;
    const hasFla = d.flags.length > 0;

    // Bar: blue = worked (capped at 40), green = leave, red = overtime beyond 40
    const blueW  = Math.min(worked, 40) / 40 * 100;
    const overW  = worked > 40 ? (worked - 40) / 40 * 100 : 0;
    const greenW = Math.min(leave / 40 * 100, 100 - Math.min(blueW + overW, 100));
    const greenLeft = Math.min(blueW + overW, 100);

    const overBadge = worked > 40
      ? `<span class="over-badge"><i class="ti ti-alert-triangle" style="font-size:10px"></i> +${(worked-40).toFixed(1)}h</span>`
      : '';

    return `<tr class="emp-row${isOpen?' open':''}${hasFla?' flagged':''}" onclick="toggleExpand('${id}')">
      <td style="width:28px;padding-left:14px"><i class="ti ti-chevron-right chevron${isOpen?' open':''}"></i></td>
      <td style="width:200px">
        <div class="emp-name">${esc(w.name)}${hasFla?' <i class="ti ti-alert-triangle" style="font-size:12px;color:#D97706;margin-left:3px"></i>':''}</div>
        <div class="emp-title">${esc(w.title)}</div>
        <div class="bar-outer">
          <div class="bar-blue"  style="width:${blueW.toFixed(1)}%"></div>
          ${overW  > 0 ? `<div class="bar-red"   style="left:${Math.min(blueW,100).toFixed(1)}%;width:${overW.toFixed(1)}%"></div>` : ''}
          ${greenW > 0 ? `<div class="bar-green" style="left:${greenLeft.toFixed(1)}%;width:${greenW.toFixed(1)}%"></div>` : ''}
        </div>
      </td>
      <td style="width:130px;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(managers[w.managerId]?.name || '—')}</td>
      <td class="r num" style="width:65px">${worked > 0.01 ? worked.toFixed(1)+overBadge : '<span class="dim">—</span>'}</td>
      <td class="r num" style="width:55px">${d.ot > 0.01 ? d.ot.toFixed(1) : '<span class="dim">—</span>'}</td>
      <td class="r num" style="width:55px">${d.pto > 0.01 ? d.pto.toFixed(1) : '<span class="dim">—</span>'}</td>
      <td class="r num" style="width:55px">${d.sick > 0.01 ? d.sick.toFixed(1) : '<span class="dim">—</span>'}</td>
      <td class="r num" style="width:55px">${(d.bereavement+d.makeup+d.parttime+d.otherLeave) > 0.01 ? (d.bereavement+d.makeup+d.parttime+d.otherLeave).toFixed(1) : '<span class="dim">—</span>'}</td>
    </tr>
    ${isOpen ? `<tr class="punch-section"><td colspan="8"><div class="punch-inner">${buildPunchTable(d.entries)}</div></td></tr>` : ''}`;
  }).join('');

  document.getElementById('tableWrap').innerHTML = `
    <table>
      <thead><tr>
        <th style="width:28px"></th>
        <th style="width:200px">Employee</th>
        <th style="width:130px">Manager</th>
        <th class="r" style="width:65px">Worked</th>
        <th class="r" style="width:55px">OT</th>
        <th class="r" style="width:55px">PTO</th>
        <th class="r" style="width:55px">Sick</th>
        <th class="r" style="width:55px">Other leave</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/* ── Punch table ── */
function buildPunchTable(entries) {
  if (!entries || !entries.length) {
    return `<div style="padding:14px 16px;font-size:12.5px;color:var(--hint)">No entries this week</div>`;
  }

  const rows = entries.map(e => {
    const dayLabel = e.date
      ? e.date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' })
      : '—';

    if (e.isLeave) {
      const lb = leaveBadge(e.leaveType);
      const timeStr = e.isPartial && e.startTimeStr
        ? `<span class="punch-time">${e.startTimeStr}</span> · ${e.hrs.toFixed(1)}h`
        : `${e.hrs.toFixed(1)}h`;
      const commentHtml = e.comments.filter(Boolean).map(c =>
        `<div class="comment-tag"><i class="ti ti-message-circle"></i><span>${esc(c)}</span></div>`
      ).join('');
      return `<tr class="punch-leave">
        <td style="width:140px"><div style="font-size:12px;font-weight:500">${dayLabel}</div>${commentHtml}</td>
        <td colspan="3" style="font-size:12px;color:var(--muted)">${timeStr}</td>
        <td style="width:100px"><span class="badge ${lb.cls}">${esc(lb.label)}</span>${e.isPaid ? '' : ' <span style="font-size:10.5px;color:var(--hint)">(unpaid)</span>'}</td>
        <td class="r" style="width:60px"><span class="num" style="font-weight:500;color:var(--green)">${e.hrs.toFixed(1)}</span></td>
      </tr>`;
    }

    const breakStr = e.breakHrs > 0
      ? `<span class="punch-time" style="color:var(--muted)">−${Math.round(e.breakHrs*60)}m</span>`
      : '<span class="dim">—</span>';

    const cats = {};
    e.segments.forEach(s => { const c = segCat(s.display_name); cats[c] = (cats[c]||0) + hrsFromSeg(s); });
    const dom = Object.entries(cats).sort((a,b)=>b[1]-a[1])[0]?.[0] || 'regular';
    const badgeCls = dom === 'ot' ? 'b-ot' : 'b-reg';
    const badgeLbl = dom === 'ot' ? 'Overtime' : 'Regular';

    const flagHtml = e.flagged
      ? `<div style="display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;color:#D97706"><i class="ti ti-alert-triangle"></i> ${e.hrs.toFixed(1)}h</div>`
      : '';
    const commentHtml = e.comments.map(c =>
      `<div class="comment-tag"><i class="ti ti-message-circle"></i><span>${esc(c)}</span></div>`
    ).join('');

    return `<tr class="${e.flagged ? 'punch-flagged' : ''}">
      <td style="width:140px"><div style="font-size:12px;font-weight:500">${dayLabel}</div>${flagHtml}${commentHtml}</td>
      <td style="width:95px"><span class="punch-time">${fmtTime(e.clockIn) || '—'}</span></td>
      <td style="width:95px"><span class="punch-time">${fmtTime(e.clockOut) || '—'}</span></td>
      <td style="width:65px">${breakStr}</td>
      <td style="width:100px"><span class="badge ${badgeCls}">${badgeLbl}</span></td>
      <td class="r" style="width:60px"><span class="num" style="font-weight:500">${e.hrs.toFixed(1)}</span></td>
    </tr>`;
  }).join('');

  return `<table class="punch-table">
    <thead><tr>
      <th style="width:140px">Date</th>
      <th style="width:95px">Clock in</th>
      <th style="width:95px">Clock out</th>
      <th style="width:65px">Breaks</th>
      <th style="width:100px">Type</th>
      <th class="r" style="width:60px">Hours</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

function toggleExpand(id) {
  expandedId = expandedId === id ? null : id;
  renderTable();
}

/* ═══════════════════════════════════
   Export
═══════════════════════════════════ */
function exportCSV() {
  const { start, end } = weekBounds();
  const { byEmp } = processAll();
  const rows = [['Week','Employee','Title','Manager','Worked','Regular','Overtime','PTO','Sick Leave','Bereavement','Make-Up Time','Part-Time Off','Leave Total']];
  const weekStr = `${toDateStr(start)} to ${toDateStr(end)}`;

  Object.keys(workers)
    .sort((a, b) => (byEmp[b]?.workedTotal || 0) - (byEmp[a]?.workedTotal || 0))
    .forEach(id => {
      const w = workers[id];
      const d = byEmp[id] || emptyBucket();
      const mgr = managers[w.managerId]?.name || '';
      rows.push([weekStr, w.name, w.title, mgr,
        d.workedTotal.toFixed(2), d.regular.toFixed(2), d.ot.toFixed(2),
        d.pto.toFixed(2), d.sick.toFixed(2), d.bereavement.toFixed(2),
        d.makeup.toFixed(2), d.parttime.toFixed(2), d.leaveTotal.toFixed(2)]);
    });

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = `care-coordinators-${toDateStr(start)}.csv`;
  a.click();
}

/* ═══════════════════════════════════
   Helpers
═══════════════════════════════════ */
function setLoading() {
  document.getElementById('tableWrap').innerHTML = `<div class="state-view"><div class="spinner"></div><span>Loading…</span></div>`;
  document.getElementById('workedMetrics').innerHTML = '';
  document.getElementById('leaveMetrics').innerHTML = '';
  document.getElementById('flagBanner').style.display = 'none';
}
function showError(msg) {
  document.getElementById('tableWrap').innerHTML = stateHTML('ti-alert-circle', esc(msg), true);
  document.getElementById('statusLine').textContent = 'Error';
}
function stateHTML(icon, msg, err) {
  return `<div class="state-view${err?' err':''}"><i class="ti ${icon}"></i><span>${msg}</span></div>`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
